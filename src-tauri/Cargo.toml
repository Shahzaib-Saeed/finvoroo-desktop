[package]
name = "finvoroo-desktop"
version = "0.1.2"
description = "Finvoroo Desktop — native Windows shell for the Finvoroo ERP web app"
authors = ["Finvoroo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "finvoroo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
