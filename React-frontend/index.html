<!doctype html>
<html class="h-full" lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/media/app/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="Finvoroo workspace" />
    <!-- Fonts: preconnect so the handshake overlaps HTML parsing, display=swap so
         text paints immediately in a fallback instead of staying invisible, and
         weight 800 included because font-extrabold is used (the login headline
         among others) and was previously being synthesised by the browser.
         Weight 300 dropped - one use in the whole app. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <style>
        .dark body {
            background-color: hsl(240 10% 4%);
        }
    </style>
    <title>Finvoroo Smart Cloud Accounting</title>
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('erp-theme') || 'system';
                const prefersDark = window.matchMedia(
                    '(prefers-color-scheme: dark)',
                ).matches;
                const isDarkMode =
                    theme === 'dark' || (theme === 'system' && prefersDark);
                if (isDarkMode) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>

<body class="text-foreground bg-background flex h-full text-base antialiased">
    <div class="flex h-full min-h-0 w-full grow" id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
