# Builds FinvorooDesktop-Setup.exe on windows-latest.
#
# Standalone finvoroo-desktop repository layout:
#   finvoroo-desktop.git  → this repo (checked out to finvoroo-desktop/)
#   React.git             → checked out to React-frontend/ (sibling folder)
#
# Matches local dev layout expected by scripts/build-frontend.mjs.
# Laravel-api-backend and finvoroo-print-agent are separate repos — not used here.

name: Finvoroo Desktop Windows installer

on:
  workflow_dispatch:
    inputs:
      react_ref:
        description: 'React repo branch, tag, or SHA (default main)'
        required: false
        default: main
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      REACT_REPO: Shahzaib-Saeed/React
      REACT_REF: >-
        ${{ github.event.inputs.react_ref
            || github.event.client_payload.react_ref
            || 'main' }}

    steps:
      - name: Checkout finvoroo-desktop
        uses: actions/checkout@v4
        with:
          path: finvoroo-desktop

      - name: Checkout React-frontend from React repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REACT_REPO }}
          ref: ${{ env.REACT_REF }}
          path: React-frontend
          token: ${{ secrets.REACT_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify build layout (React-frontend + finvoroo-desktop)
        shell: pwsh
        run: |
          $missing = @()
          if (-not (Test-Path 'React-frontend/package.json')) {
            $missing += "React-frontend/ (from ${{ env.REACT_REPO }}@${{ env.REACT_REF }})"
          }
          if (-not (Test-Path 'finvoroo-desktop/package.json')) {
            $missing += 'finvoroo-desktop/ (this repository root content)'
          }
          if ($missing.Count -gt 0) {
            Write-Error @"
          Missing required directories for the desktop build:
            $($missing -join "`n  ")

          Expected CI layout (siblings, same as local dev):
            finvoroo-desktop/   ← this repo
            React-frontend/     ← cloned from ${{ env.REACT_REPO }}

          Laravel and finvoroo-print-agent are NOT part of this build.
          "@
            exit 1
          }
          Write-Host "Build layout OK (React @ ${{ env.REACT_REF }}, finvoroo-desktop present)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            React-frontend/package-lock.json
            finvoroo-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: finvoroo-desktop/src-tauri

      - name: Install React-frontend dependencies
        working-directory: React-frontend
        run: npm ci

      - name: Install finvoroo-desktop dependencies
        working-directory: finvoroo-desktop
        run: npm ci

      - name: Build React production bundle into finvoroo-desktop/webapp/
        working-directory: finvoroo-desktop
        run: npm run build:frontend

      - name: Verify React bundle in webapp/
        shell: pwsh
        run: |
          $index = 'finvoroo-desktop/webapp/index.html'
          if (-not (Test-Path $index)) {
            Write-Error "Missing $index — React-frontend build failed or did not output to finvoroo-desktop/webapp/."
            exit 1
          }
          $assets = Get-ChildItem 'finvoroo-desktop/webapp/assets' -ErrorAction SilentlyContinue
          if (-not $assets -or $assets.Count -eq 0) {
            Write-Error 'finvoroo-desktop/webapp/assets/ is empty — the frontend bundle is incomplete.'
            exit 1
          }
          Write-Host "webapp bundle OK ($($assets.Count) asset file(s)) — safe to run Tauri NSIS build."

      - name: Build Windows NSIS installer (Tauri)
        working-directory: finvoroo-desktop
        run: npx tauri build --bundles nsis

      - name: Publish FinvorooDesktop-Setup.exe
        working-directory: finvoroo-desktop
        run: npm run publish-installer

      - name: Verify FinvorooDesktop-Setup.exe
        shell: pwsh
        run: |
          $installer = 'finvoroo-desktop/dist/FinvorooDesktop-Setup.exe'
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer — NSIS build or publish-installer step failed."
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item $installer).Length / 1MB, 2)
          if ($sizeMb -lt 5) {
            Write-Error "Installer is only ${sizeMb} MB — expected tens of MB; webapp/ was likely empty during tauri build."
            exit 1
          }
          Write-Host "Installer OK (${sizeMb} MB)."

      - name: Upload FinvorooDesktop-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FinvorooDesktop-Setup
          path: |
            finvoroo-desktop/dist/FinvorooDesktop-Setup.exe
            finvoroo-desktop/src-tauri/target/release/bundle/nsis/FinvorooDesktop-Setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: finvoroo-desktop/dist/FinvorooDesktop-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
