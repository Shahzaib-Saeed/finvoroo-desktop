# Builds FinvorooDesktop-Setup.exe on windows-latest.
#
# Single-repo layout (finvoroo-desktop.git):
#   package.json, src-tauri/     ← desktop shell
#   React-frontend/              ← bundled React source for CI build
#   webapp/                      ← generated (gitignored), embedded in installer
#
# The installer is a Tauri shell around the React app. It talks to the
# cloud API (api.finvoroo.com). Laravel is NOT cloned or bundled in CI —
# that extra checkout was breaking Windows builds.

name: Finvoroo Desktop Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
    paths:
      - 'React-frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finvoroo-desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout finvoroo-desktop (includes React-frontend/)
        uses: actions/checkout@v5

      - name: Verify React-frontend is bundled in this repo
        shell: pwsh
        run: |
          if (-not (Test-Path 'React-frontend/package.json')) {
            Write-Error @"
          React-frontend/ is missing from finvoroo-desktop.git.
          Copy your React source into React-frontend/ and push, then re-run.
          "@
            exit 1
          }
          if (-not (Test-Path 'package.json')) {
            Write-Error 'Desktop package.json missing at repo root.'
            exit 1
          }
          Write-Host 'Single-repo layout OK (React-frontend/ + desktop shell).'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            React-frontend/package-lock.json
            package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install React-frontend dependencies
        working-directory: React-frontend
        run: npm ci

      - name: Install finvoroo-desktop dependencies
        run: npm ci

      - name: Build React production bundle into webapp/
        run: npm run build:frontend

      - name: Verify React bundle in webapp/
        shell: pwsh
        run: |
          if (-not (Test-Path 'webapp/index.html')) {
            Write-Error 'Missing webapp/index.html — React build failed.'
            exit 1
          }
          $assets = Get-ChildItem 'webapp/assets' -ErrorAction SilentlyContinue
          if (-not $assets -or $assets.Count -eq 0) {
            Write-Error 'webapp/assets/ is empty — frontend bundle incomplete.'
            exit 1
          }
          Write-Host "webapp bundle OK ($($assets.Count) asset file(s))."

      - name: Generate Pharmacy POS branding (icons + installer art)
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/generate-pharmacy-branding.py

      - name: Build Windows NSIS installer (Tauri)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Publish FinvorooDesktop-Setup.exe
        run: npm run publish-installer

      - name: Verify signed updater manifest
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/desktop-latest.json')) {
            Write-Error 'Missing dist/desktop-latest.json — signing key or publish-installer failed.'
            exit 1
          }
          $manifest = Get-Content 'dist/desktop-latest.json' -Raw | ConvertFrom-Json
          if (-not $manifest.platforms.'windows-x86_64'.signature) {
            Write-Error 'desktop-latest.json has no windows-x86_64 signature.'
            exit 1
          }
          Write-Host "Updater manifest OK (v$($manifest.version))."

      - name: Verify FinvorooDesktop-Setup.exe
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FinvorooDesktop-Setup.exe')) {
            Write-Error 'Installer not found at dist/FinvorooDesktop-Setup.exe.'
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item 'dist/FinvorooDesktop-Setup.exe').Length / 1MB, 2)
          if ($sizeMb -lt 5) {
            Write-Error "Installer is only ${sizeMb} MB — webapp/ was likely empty."
            exit 1
          }
          Write-Host "Installer OK (${sizeMb} MB)."

      - name: Upload FinvorooDesktop-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FinvorooDesktop-Setup
          # dist/desktop-latest.json carries the updater "platforms" field (signature +
          # url) only when TAURI_SIGNING_PRIVATE_KEY was set above — upload both so the
          # manual publish step to app.finvoroo.com/downloads/ has everything it needs.
          path: |
            dist/FinvorooDesktop-Setup.exe
            dist/desktop-latest.json
            src-tauri/target/release/bundle/nsis/FinvorooDesktop-Setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FinvorooDesktop-Setup.exe
            dist/desktop-latest.json
            src-tauri/target/release/bundle/nsis/*.exe.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
