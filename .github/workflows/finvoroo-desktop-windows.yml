# Builds FinvorooDesktop-Setup.exe on windows-latest.
#
# Single-repo layout (finvoroo-desktop.git):
#   package.json, src-tauri/     ← desktop shell
#   React-frontend/              ← bundled React source for CI build
#   webapp/                      ← generated (gitignored), embedded in installer
#
# Tauri also bundles ../../Laravel-api-backend (see src-tauri/tauri.conf.json).
# CI checks out Shahzaib-Saeed/finvoroo next to this repo as Laravel-api-backend/.

name: Finvoroo Desktop Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'desktop-v*'
    paths:
      - 'React-frontend/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finvoroo-desktop-windows.yml'

permissions:
  contents: read

jobs:
  windows-nsis:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout finvoroo-desktop (includes React-frontend/)
        uses: actions/checkout@v4

      - name: Verify React-frontend is bundled in this repo
        shell: pwsh
        run: |
          if (-not (Test-Path 'React-frontend/package.json')) {
            Write-Error @"
          React-frontend/ is missing from finvoroo-desktop.git.
          Copy your React source into React-frontend/ and push, then re-run.
          "@
            exit 1
          }
          if (-not (Test-Path 'package.json')) {
            Write-Error 'Desktop package.json missing at repo root.'
            exit 1
          }
          Write-Host 'Single-repo layout OK (React-frontend/ + desktop shell).'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            React-frontend/package-lock.json
            package-lock.json

      - name: Require Laravel repo access token
        shell: pwsh
        env:
          LARAVEL_REPO_PAT: ${{ secrets.LARAVEL_REPO_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LARAVEL_REPO_PAT)) {
            Write-Error @"
          Missing repository secret: LARAVEL_REPO_PAT

          The finvoroo Laravel API repo (Shahzaib-Saeed/finvoroo) is private.
          GITHUB_TOKEN cannot read other private repos, so checkout returns "Not Found".

          Fix (one-time):
          1. GitHub → Settings → Developer settings → Personal access tokens
          2. Create a token with read access to Shahzaib-Saeed/finvoroo
             (classic: repo scope · fine-grained: Contents read on finvoroo)
          3. finvoroo-desktop repo → Settings → Secrets → Actions
          4. New secret: LARAVEL_REPO_PAT = paste the token
          5. Re-run this workflow
          "@
            exit 1
          }
          Write-Host 'LARAVEL_REPO_PAT is configured.'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install React-frontend dependencies
        working-directory: React-frontend
        run: npm ci

      - name: Install finvoroo-desktop dependencies
        run: npm ci

      - name: Build React production bundle into webapp/
        run: npm run build:frontend

      - name: Verify React bundle in webapp/
        shell: pwsh
        run: |
          if (-not (Test-Path 'webapp/index.html')) {
            Write-Error 'Missing webapp/index.html — React build failed.'
            exit 1
          }
          $assets = Get-ChildItem 'webapp/assets' -ErrorAction SilentlyContinue
          if (-not $assets -or $assets.Count -eq 0) {
            Write-Error 'webapp/assets/ is empty — frontend bundle incomplete.'
            exit 1
          }
          Write-Host "webapp bundle OK ($($assets.Count) asset file(s))."

      - name: Checkout Laravel API for Tauri bundle
        uses: actions/checkout@v4
        with:
          repository: Shahzaib-Saeed/finvoroo
          path: _laravel-api-backend
          token: ${{ secrets.LARAVEL_REPO_PAT }}

      - name: Place Laravel API where Tauri expects it
        shell: pwsh
        run: |
          $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
          $dest = Join-Path $parent "Laravel-api-backend"
          $src = "_laravel-api-backend"

          if (Test-Path (Join-Path $src "Laravel-api-backend/artisan")) {
            $src = Join-Path $src "Laravel-api-backend"
          }

          if (-not (Test-Path (Join-Path $src "artisan"))) {
            Write-Error @"
          Checked out finvoroo repo but artisan was not found.
          Expected either:
            - _laravel-api-backend/artisan
            - _laravel-api-backend/Laravel-api-backend/artisan
          "@
            exit 1
          }

          if (Test-Path $dest) {
            Remove-Item -Recurse -Force $dest
          }
          Move-Item -Force $src $dest

          $tauriExpects = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE "..\..\Laravel-api-backend")).Path
          if ($tauriExpects -ne (Resolve-Path $dest).Path) {
            Write-Error "Laravel path mismatch. Tauri expects $tauriExpects but placed at $dest"
            exit 1
          }

          Write-Host "Laravel API ready at $dest"

      - name: Verify Tauri Laravel resource path exists
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "..\..\Laravel-api-backend"
          if (-not (Test-Path (Join-Path $path "artisan"))) {
            Write-Error "Tauri resource path missing: $path (artisan not found)"
            exit 1
          }
          Write-Host "Tauri resource path OK: $path"

      - name: Build Windows NSIS installer (Tauri)
        run: npx tauri build --bundles nsis

      - name: Publish FinvorooDesktop-Setup.exe
        run: npm run publish-installer

      - name: Verify FinvorooDesktop-Setup.exe
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/FinvorooDesktop-Setup.exe')) {
            Write-Error 'Installer not found at dist/FinvorooDesktop-Setup.exe.'
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item 'dist/FinvorooDesktop-Setup.exe').Length / 1MB, 2)
          if ($sizeMb -lt 5) {
            Write-Error "Installer is only ${sizeMb} MB — webapp/ was likely empty."
            exit 1
          }
          Write-Host "Installer OK (${sizeMb} MB)."

      - name: Upload FinvorooDesktop-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: FinvorooDesktop-Setup
          path: |
            dist/FinvorooDesktop-Setup.exe
            src-tauri/target/release/bundle/nsis/FinvorooDesktop-Setup.exe
          retention-days: 30
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FinvorooDesktop-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
